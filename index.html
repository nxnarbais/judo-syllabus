<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Réviser les techniques de Judo par ceinture et chevron : programme du dojo et référentiel officiel SJV / ASJ." />
  <meta name="theme-color" content="#f7f4ec" />
  <title>Référentiel Judo — Ceintures &amp; Chevrons</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body x-data="judoApp()" x-init="init()">
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="44" height="44" />
        <div>
          <h1 class="site-title">Référentiel Judo</h1>
          <p class="site-subtitle" x-text="currentTrack?.description || 'Ceintures & chevrons'">Ceintures &amp; chevrons</p>
        </div>
      </div>

      <div class="header-side" x-show="!loading && !error" x-cloak>
        <button
          type="button"
          class="glossary-btn"
          @click="openGlossary()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h8M8 11h6"/></svg>
          <span>Lexique JP → FR</span>
        </button>

        <div class="segmented track-switcher" role="group" aria-label="Programme">
          <template x-for="trackKey in Object.keys(tracks)" :key="trackKey">
            <button
              type="button"
              class="seg-btn"
              :class="{ active: selectedTrack === trackKey }"
              :aria-pressed="selectedTrack === trackKey"
              @click="setTrack(trackKey)"
              x-text="tracks[trackKey].label"
            ></button>
          </template>
        </div>

        <div class="overall" :aria-label="`${trackProgress.done} sur ${trackProgress.total} techniques acquises`">
          <div class="overall-text">
            <span>Progression</span>
            <strong x-text="`${trackProgress.done} / ${trackProgress.total}`"></strong>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <span :style="`width: ${pct(trackProgress)}%`"></span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div x-show="loading" class="empty-state">Chargement du référentiel…</div>
    <div x-show="error" x-cloak class="empty-state" x-text="error"></div>

    <div x-show="!loading && !error" x-cloak>
      <section class="controls" aria-label="Filtres">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input
            type="search"
            class="search-input"
            placeholder="Rechercher : osoto, hanche, clé…"
            x-model.trim="search"
            aria-label="Rechercher une technique"
          />
          <button type="button" class="search-clear" x-show="search" x-cloak @click="search = ''" aria-label="Effacer la recherche">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="filter-row">
          <div class="filter">
            <span class="filter-label" id="lbl-type">Type</span>
            <div class="segmented" role="group" aria-labelledby="lbl-type">
              <template x-for="g in groupOptions" :key="g.value">
                <button
                  type="button"
                  class="seg-btn"
                  :class="{ active: selectedGroup === g.value }"
                  :aria-pressed="selectedGroup === g.value"
                  @click="selectedGroup = g.value"
                >
                  <span x-text="g.label"></span>
                  <small x-show="g.hint" x-text="g.hint"></small>
                </button>
              </template>
            </div>
          </div>

          <div class="filter">
            <span class="filter-label" id="lbl-status">Statut</span>
            <div class="segmented" role="group" aria-labelledby="lbl-status">
              <template x-for="s in statusOptions" :key="s.value">
                <button
                  type="button"
                  class="seg-btn"
                  :class="{ active: selectedStatus === s.value }"
                  :aria-pressed="selectedStatus === s.value"
                  @click="selectedStatus = s.value"
                  x-text="s.label"
                ></button>
              </template>
            </div>
          </div>

          <button type="button" class="reset-filters" x-show="filtersActive" x-cloak @click="resetFilters()">
            Effacer les filtres
          </button>
        </div>
      </section>

      <nav class="belt-nav" aria-label="Niveaux de ceinture">
        <div class="belt-tabs" role="group" aria-label="Filtrer par ceinture">
          <button
            type="button"
            class="belt-tab"
            :class="{ active: isAllBelts }"
            :aria-pressed="isAllBelts"
            @click="toggleBelt('all')"
          >
            <span class="belt-tab-name">Toutes</span>
            <span class="belt-tab-count" x-text="`${trackProgress.done}/${trackProgress.total}`"></span>
          </button>

          <template x-for="belt in currentBelts" :key="belt.id">
            <button
              type="button"
              class="belt-tab"
              :class="{ active: isBeltSelected(belt.id), complete: isComplete(belt) }"
              :aria-pressed="isBeltSelected(belt.id)"
              :title="belt.name"
              @click="toggleBelt(belt.id)"
            >
              <span class="obi" :class="{ stripe: belt.is_stripe }" :style="`--belt: ${belt.color}`" aria-hidden="true"></span>
              <span class="belt-tab-name" x-text="belt.short_name"></span>
              <span class="belt-tab-count" x-text="`${progressOf(belt.items).done}/${progressOf(belt.items).total}`"></span>
            </button>
          </template>
        </div>

        <label class="toggle" x-show="!isAllBelts" x-cloak>
          <input type="checkbox" x-model="cumulative" />
          <span class="toggle-track" aria-hidden="true"><span></span></span>
          Inclure les ceintures précédentes
        </label>
      </nav>

      <div x-show="filteredBelts.length === 0" class="empty-state">
        <p>Aucune technique ne correspond à ces critères.</p>
        <button type="button" class="btn-secondary" x-show="filtersActive" @click="resetFilters()">Effacer les filtres</button>
      </div>

      <template x-for="belt in filteredBelts" :key="belt.id">
        <section class="belt-section" :id="`section-${belt.id}`">
          <header class="belt-heading">
            <span class="obi large" :class="{ stripe: belt.is_stripe }" :style="`--belt: ${belt.color}`" aria-hidden="true"></span>
            <h2 x-text="belt.name"></h2>
            <span class="belt-count" :class="{ complete: belt.progress.done === belt.progress.total }" x-text="`${belt.progress.done} / ${belt.progress.total} acquise${belt.progress.done > 1 ? 's' : ''}`"></span>
          </header>
          <div class="progress-bar" role="progressbar" :aria-valuenow="belt.progress.done" aria-valuemin="0" :aria-valuemax="belt.progress.total" :aria-label="`Progression ${belt.name}`">
            <span :style="`width: ${pct(belt.progress)}%`"></span>
          </div>

          <div class="cards-grid">
            <template x-for="(item, idx) in belt.items" :key="`${belt.id}-${item.id}-${idx}`">
              <article
                class="tech-card"
                :class="{ mastered: isMastered(item.id) }"
                x-data="{ showMistakes: false, tech: getTech(item.id) }"
              >
                <div class="card-header">
                  <div class="card-titles">
                    <h3 class="tech-name" x-text="tech.name"></h3>
                    <p class="tech-french">
                      <span x-text="tech.french_name"></span>
                      <span x-show="tech.category" x-text="` · ${tech.category}`"></span>
                    </p>
                  </div>
                  <span
                    class="badge-group"
                    :class="item.group === 'Nage-waza' ? 'nage' : 'katame'"
                    x-text="item.group === 'Nage-waza' ? 'Debout' : 'Sol'"
                  ></span>
                </div>
                <span class="tech-note" x-show="item.note" x-text="item.note"></span>

                <template x-if="(tech.images || []).length > 0">
                  <div
                    class="tech-carousel"
                    role="region"
                    aria-roledescription="carousel"
                    :aria-label="`Illustrations de ${tech.name}`"
                    x-data="{
                      activeSlide: 0,
                      rafPending: false,
                      count() { return (tech.images || []).length; },
                      goTo(idx) {
                        const track = this.$refs.track;
                        if (!track) return;
                        const total = this.count();
                        const target = ((idx % total) + total) % total;
                        this.activeSlide = target;
                        track.scrollTo({ left: target * track.clientWidth });
                      },
                      onScroll() {
                        if (this.rafPending) return;
                        this.rafPending = true;
                        requestAnimationFrame(() => {
                          this.rafPending = false;
                          const track = this.$refs.track;
                          if (!track || !track.clientWidth) return;
                          this.activeSlide = Math.round(track.scrollLeft / track.clientWidth);
                        });
                      }
                    }"
                  >
                    <div class="carousel-stage">
                      <template x-if="tech.images.length > 1">
                        <div class="carousel-controls">
                          <button
                            type="button"
                            class="carousel-btn"
                            @click="goTo(activeSlide - 1)"
                            aria-label="Image précédente"
                          >
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                          </button>
                          <button
                            type="button"
                            class="carousel-btn"
                            @click="goTo(activeSlide + 1)"
                            aria-label="Image suivante"
                          >
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                          </button>
                        </div>
                      </template>

                      <div
                        class="carousel-track"
                        x-ref="track"
                        tabindex="0"
                        role="group"
                        aria-label="Images"
                        @scroll="onScroll()"
                      >
                        <template x-for="(img, iIdx) in tech.images" :key="img.url">
                          <figure
                            class="carousel-slide"
                            role="group"
                            aria-roledescription="slide"
                            :aria-label="`${iIdx + 1} sur ${tech.images.length}`"
                          >
                            <button
                              type="button"
                              class="carousel-img-btn"
                              @click="openLightbox(tech, iIdx)"
                              :aria-label="`Agrandir ${tech.name} — ${img.title}`"
                            >
                              <img
                                class="carousel-img"
                                :src="img.url"
                                :alt="`${tech.name} — ${img.title}`"
                                loading="lazy"
                              />
                            </button>
                            <figcaption class="carousel-caption" x-text="img.credit"></figcaption>
                          </figure>
                        </template>
                      </div>
                    </div>

                    <template x-if="tech.images.length > 1">
                      <nav class="carousel-markers" aria-label="Choisir une image">
                        <template x-for="(img, iIdx) in tech.images" :key="`dot-${iIdx}`">
                          <button
                            type="button"
                            class="carousel-dot"
                            :aria-current="activeSlide === iIdx ? 'true' : 'false'"
                            :aria-label="`Image ${iIdx + 1} sur ${tech.images.length}`"
                            @click="goTo(iIdx)"
                          ></button>
                        </template>
                      </nav>
                    </template>
                  </div>
                </template>

                <template x-if="tech.videos?.baseline?.youtube_id">
                  <a
                    class="video-link"
                    :href="tech.videos.baseline.url"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <div class="video-thumb-wrap">
                      <img
                        class="video-thumb"
                        :src="`https://i.ytimg.com/vi/${tech.videos.baseline.youtube_id}/hqdefault.jpg`"
                        :alt="tech.videos.baseline.title || tech.name"
                        loading="lazy"
                      />
                      <span class="play-circle" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
                      </span>
                    </div>
                    <div class="video-meta">
                      <span class="video-title" x-text="tech.videos.baseline.title"></span>
                      <span class="video-channel" x-text="tech.videos.baseline.channel || 'YouTube'"></span>
                    </div>
                  </a>
                </template>

                <template x-if="!tech.videos?.baseline?.youtube_id">
                  <div class="video-placeholder">
                    <span>Pas encore de vidéo validée</span>
                    <a
                      class="yt-search-link"
                      :href="`https://www.youtube.com/results?search_query=${encodeURIComponent('judo ' + tech.name + ' kodokan')}`"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Chercher sur YouTube
                    </a>
                  </div>
                </template>

                <div x-show="(tech.mechanics || []).length">
                  <p class="section-label">Points clés</p>
                  <ol class="mechanics-list">
                    <template x-for="(point, pIdx) in (tech.mechanics || [])" :key="pIdx">
                      <li x-text="point"></li>
                    </template>
                  </ol>
                </div>

                <template x-if="(tech.videos?.mistakes_and_counters || []).length > 0">
                  <div>
                    <button
                      type="button"
                      class="mistakes-toggle"
                      :aria-expanded="showMistakes"
                      @click="showMistakes = !showMistakes"
                    >
                      <span x-text="`Erreurs fréquentes & contres (${tech.videos.mistakes_and_counters.length})`"></span>
                      <svg class="chevron" :class="{ open: showMistakes }" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>

                    <div class="mistakes-body" x-show="showMistakes" x-transition.opacity>
                      <template x-for="(m, mIdx) in tech.videos.mistakes_and_counters" :key="mIdx">
                        <div class="mistake-item">
                          <a
                            class="mistake-link"
                            :href="m.url"
                            target="_blank"
                            rel="noopener noreferrer"
                            x-text="m.title + (m.channel ? ` (${m.channel})` : '')"
                          ></a>
                          <p class="mistake-note" x-show="m.note" x-text="m.note"></p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <button
                  type="button"
                  class="mastered-toggle"
                  :class="{ active: isMastered(item.id) }"
                  :aria-pressed="isMastered(item.id)"
                  @click="toggleMastered(item.id)"
                >
                  <span class="check" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
                  </span>
                  <span x-text="isMastered(item.id) ? 'Acquise' : 'Marquer comme acquise'"></span>
                </button>
              </article>
            </template>
          </div>
        </section>
      </template>
    </div>
  </main>

  <footer class="container site-footer">
    <p>Référentiel hors ligne · Progression enregistrée sur cet appareil</p>
    <p x-show="Object.keys(mastered).length > 0" x-cloak>
      <button type="button" class="link-btn" @click="resetProgress()">Réinitialiser ma progression</button>
    </p>
  </footer>

  <dialog
    id="glossary-dialog"
    class="glossary-dialog"
    closedby="any"
    aria-labelledby="glossary-title"
    x-ref="glossaryDialog"
    @close="glossarySearch = ''; glossaryKind = 'all'"
  >
    <div class="glossary-header">
      <div>
        <h2 id="glossary-title" class="glossary-title">Lexique japonais → français</h2>
        <p class="glossary-subtitle" x-text="`${filteredGlossary.length} terme${filteredGlossary.length > 1 ? 's' : ''} affiché${filteredGlossary.length > 1 ? 's' : ''}`"></p>
      </div>
      <button type="button" class="glossary-close" @click="$refs.glossaryDialog.close()" aria-label="Fermer le lexique">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="glossary-controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input
          type="search"
          class="search-input"
          placeholder="Chercher un terme (ex. kuzushi, fauchage, goshi…)"
          x-model.trim="glossarySearch"
          aria-label="Rechercher dans le lexique"
          autofocus
        />
        <button type="button" class="search-clear" x-show="glossarySearch" x-cloak @click="glossarySearch = ''" aria-label="Effacer la recherche du lexique">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="segmented glossary-kinds" role="group" aria-label="Catégorie de termes">
        <template x-for="opt in glossaryKindOptions" :key="opt.value">
          <button
            type="button"
            class="seg-btn"
            :class="{ active: glossaryKind === opt.value }"
            :aria-pressed="glossaryKind === opt.value"
            @click="glossaryKind = opt.value"
            x-text="opt.label"
          ></button>
        </template>
      </div>
    </div>

    <div class="glossary-body">
      <p x-show="filteredGlossary.length === 0" class="glossary-empty">Aucun terme ne correspond à cette recherche.</p>
      <dl class="glossary-list" x-show="filteredGlossary.length > 0">
        <template x-for="entry in filteredGlossary" :key="`${entry.kind}-${entry.jp}`">
          <div class="glossary-row">
            <dt class="glossary-jp">
              <span x-text="entry.jp"></span>
              <span class="glossary-badge" :class="entry.kind" x-text="entry.badge"></span>
            </dt>
            <dd class="glossary-fr" x-text="entry.fr"></dd>
          </div>
        </template>
      </dl>
    </div>
  </dialog>

  <dialog
    id="lightbox-dialog"
    class="lightbox-dialog"
    closedby="any"
    aria-labelledby="lightbox-title"
    x-ref="lightboxDialog"
    @close="lightbox = null"
    @keydown.left.prevent="lightbox && lightbox.images.length > 1 && stepLightbox(-1)"
    @keydown.right.prevent="lightbox && lightbox.images.length > 1 && stepLightbox(1)"
  >
    <template x-if="lightbox">
      <div class="lightbox-inner">
        <div class="lightbox-header">
          <div>
            <h2 id="lightbox-title" class="lightbox-title" x-text="lightbox.name"></h2>
            <p class="lightbox-subtitle" x-text="lightbox.images[lightbox.index]?.title"></p>
          </div>
          <button type="button" class="glossary-close" @click="$refs.lightboxDialog.close()" aria-label="Fermer l’image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="lightbox-stage">
          <button
            type="button"
            class="carousel-btn lightbox-nav prev"
            x-show="lightbox.images.length > 1"
            @click="stepLightbox(-1)"
            aria-label="Image précédente"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>

          <img
            class="lightbox-img"
            :src="lightbox.images[lightbox.index]?.url"
            :alt="`${lightbox.name} — ${lightbox.images[lightbox.index]?.title}`"
          />

          <button
            type="button"
            class="carousel-btn lightbox-nav next"
            x-show="lightbox.images.length > 1"
            @click="stepLightbox(1)"
            aria-label="Image suivante"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <div class="lightbox-footer">
          <span class="lightbox-credit" x-text="lightbox.images[lightbox.index]?.credit"></span>
          <span class="lightbox-counter" x-show="lightbox.images.length > 1" x-text="`${lightbox.index + 1} / ${lightbox.images.length}`"></span>
        </div>
      </div>
    </template>
  </dialog>

  <script>
    const MASTERED_KEY = 'judo:mastered';

    const JUDO_GLOSSARY = [
      // Familles et catégories techniques
      { jp: 'Nage-waza', fr: 'Techniques de projection (debout)', kind: 'notion', badge: 'Famille' },
      { jp: 'Katame-waza', fr: 'Techniques de contrôle (au sol)', kind: 'notion', badge: 'Famille' },
      { jp: 'Ashi-waza', fr: 'Techniques de jambes et de pieds', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Koshi-waza', fr: 'Techniques de hanches', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Te-waza', fr: 'Techniques de bras et d’épaules', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Sutemi-waza', fr: 'Techniques de sacrifice (chute du lanceur)', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Ma-sutemi-waza', fr: 'Techniques de sacrifice dans l’axe (sur le dos)', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Yoko-sutemi-waza', fr: 'Techniques de sacrifice sur le côté', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Osaekomi-waza', fr: 'Techniques d’immobilisation', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Shime-waza', fr: 'Techniques d’étranglement', kind: 'notion', badge: 'Catégorie' },
      { jp: 'Kansetsu-waza', fr: 'Techniques de luxation (clés articulaires)', kind: 'notion', badge: 'Catégorie' },

      // Principes fondamentaux, dojo et arbitrage
      { jp: 'Kuzushi', fr: 'Déséquilibre de l’adversaire (1re phase d’une projection)', kind: 'notion', badge: 'Principe' },
      { jp: 'Tsukuri', fr: 'Placement / préparation du corps avant l’exécution', kind: 'notion', badge: 'Principe' },
      { jp: 'Kake', fr: 'Exécution finale de la projection', kind: 'notion', badge: 'Principe' },
      { jp: 'Tori', fr: 'Celui qui exécute la technique', kind: 'notion', badge: 'Rôle' },
      { jp: 'Uke', fr: 'Celui qui subit la technique (le partenaire)', kind: 'notion', badge: 'Rôle' },
      { jp: 'Kumi-kata', fr: 'Prise de garde (saisie du judogi)', kind: 'notion', badge: 'Principe' },
      { jp: 'Tai-sabaki', fr: 'Déplacement et rotation du corps', kind: 'notion', badge: 'Principe' },
      { jp: 'Ukemi', fr: 'Brise-chute (art de tomber sans se blesser)', kind: 'notion', badge: 'Principe' },
      { jp: 'Randori', fr: 'Exercice libre d’entraînement / combat souple', kind: 'notion', badge: 'Dojo' },
      { jp: 'Shiai', fr: 'Compétition, combat arbitré', kind: 'notion', badge: 'Dojo' },
      { jp: 'Judogi', fr: 'Tenue de judo (veste, pantalon, ceinture)', kind: 'notion', badge: 'Dojo' },
      { jp: 'Obi', fr: 'Ceinture', kind: 'notion', badge: 'Dojo' },
      { jp: 'Tatami', fr: 'Tapis de pratique', kind: 'notion', badge: 'Dojo' },
      { jp: 'Rei', fr: 'Salut', kind: 'notion', badge: 'Dojo' },
      { jp: 'Hajime', fr: 'Commencez ! (ordre de début de combat)', kind: 'notion', badge: 'Arbitrage' },
      { jp: 'Matte', fr: 'Arrêtez / attendez ! (interruption temporaire)', kind: 'notion', badge: 'Arbitrage' },
      { jp: 'Sore-made', fr: 'Fin du combat', kind: 'notion', badge: 'Arbitrage' },
      { jp: 'Osae-komi', fr: 'Immobilisation en cours (début du décompte)', kind: 'notion', badge: 'Arbitrage' },
      { jp: 'Toketa', fr: 'Sortie d’immobilisation (fin du décompte)', kind: 'notion', badge: 'Arbitrage' },
      { jp: 'Ippon', fr: 'Point complet (victoire immédiate)', kind: 'notion', badge: 'Arbitrage' },
      { jp: 'Waza-ari', fr: 'Demi-point (avantage technique important)', kind: 'notion', badge: 'Arbitrage' },

      // Racines et éléments fréquents dans les noms de techniques
      { jp: 'O-', fr: 'Grand (ex. O-soto-gari : grand fauchage extérieur)', kind: 'racine', badge: 'Racine' },
      { jp: 'Ko-', fr: 'Petit (ex. Ko-uchi-gari : petit fauchage intérieur)', kind: 'racine', badge: 'Racine' },
      { jp: 'Soto', fr: 'Extérieur', kind: 'racine', badge: 'Racine' },
      { jp: 'Uchi', fr: 'Intérieur', kind: 'racine', badge: 'Racine' },
      { jp: 'Mae', fr: 'Avant, devant', kind: 'racine', badge: 'Racine' },
      { jp: 'Ushiro', fr: 'Arrière, derrière', kind: 'racine', badge: 'Racine' },
      { jp: 'Yoko', fr: 'Côté, latéral', kind: 'racine', badge: 'Racine' },
      { jp: 'Sumi', fr: 'Angle, coin', kind: 'racine', badge: 'Racine' },
      { jp: 'Gari / Kari', fr: 'Fauchage', kind: 'racine', badge: 'Racine' },
      { jp: 'Gake / Kake', fr: 'Accrochage', kind: 'racine', badge: 'Racine' },
      { jp: 'Harai / Barai', fr: 'Balayage', kind: 'racine', badge: 'Racine' },
      { jp: 'Guruma / Kuruma', fr: 'Roue, enroulement', kind: 'racine', badge: 'Racine' },
      { jp: 'Goshi / Koshi', fr: 'Hanche', kind: 'racine', badge: 'Racine' },
      { jp: 'Otoshi', fr: 'Renversement, chute vers le bas', kind: 'racine', badge: 'Racine' },
      { jp: 'Nage', fr: 'Projection, lancer', kind: 'racine', badge: 'Racine' },
      { jp: 'Seoi', fr: 'Porter sur le dos', kind: 'racine', badge: 'Racine' },
      { jp: 'Gatame / Katame', fr: 'Contrôle, maintien', kind: 'racine', badge: 'Racine' },
      { jp: 'Shime / Jime', fr: 'Étranglement', kind: 'racine', badge: 'Racine' },
      { jp: 'Garami', fr: 'Enroulement, clé en torsion', kind: 'racine', badge: 'Racine' },
      { jp: 'Hishigi', fr: 'Luxation, hyperextension', kind: 'racine', badge: 'Racine' },
      { jp: 'Ashi', fr: 'Jambe, pied', kind: 'racine', badge: 'Racine' },
      { jp: 'Hiza', fr: 'Genou', kind: 'racine', badge: 'Racine' },
      { jp: 'Te', fr: 'Main, bras', kind: 'racine', badge: 'Racine' },
      { jp: 'Ude', fr: 'Bras', kind: 'racine', badge: 'Racine' },
      { jp: 'Kata', fr: 'Épaule (ou forme codifiée)', kind: 'racine', badge: 'Racine' },
      { jp: 'Kubi', fr: 'Cou, nuque', kind: 'racine', badge: 'Racine' },
      { jp: 'Sode', fr: 'Manche du judogi', kind: 'racine', badge: 'Racine' },
      { jp: 'Eri', fr: 'Revers / col du judogi', kind: 'racine', badge: 'Racine' },
      { jp: 'Tomoe', fr: 'En cercle, en boucle', kind: 'racine', badge: 'Racine' },
      { jp: 'Juji', fr: 'En croix', kind: 'racine', badge: 'Racine' },
      { jp: 'Kesa', fr: 'En écharpe (en diagonale)', kind: 'racine', badge: 'Racine' },
      { jp: 'Shiho', fr: 'Quatre côtés / quatre points d’appui', kind: 'racine', badge: 'Racine' },
      { jp: 'Tate', fr: 'Vertical, à cheval', kind: 'racine', badge: 'Racine' },
      { jp: 'Kami', fr: 'Supérieur, par-dessus la tête', kind: 'racine', badge: 'Racine' },
      { jp: 'Kuzure', fr: 'Variante', kind: 'racine', badge: 'Racine' },
      { jp: 'Gyaku', fr: 'Inversé, contraire', kind: 'racine', badge: 'Racine' },
      { jp: 'Morote', fr: 'À deux mains', kind: 'racine', badge: 'Racine' },
      { jp: 'Tsuri', fr: 'Soulever, pêcher', kind: 'racine', badge: 'Racine' },
      { jp: 'Komi', fr: 'Entrer, tirer vers soi', kind: 'racine', badge: 'Racine' },
    ];

    // Accent-, case- and hyphen-insensitive form used for search ("osoto" matches "O-soto-gari", "cle" matches "clé").
    function normalize(text) {
      return String(text || '')
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/[-\s'’]+/g, '');
    }

    function loadMastered() {
      try {
        return JSON.parse(localStorage.getItem(MASTERED_KEY)) || {};
      } catch {
        return {};
      }
    }

    function judoApp() {
      return {
        loading: true,
        error: '',
        meta: {},
        tracks: {},
        techniques: {},
        selectedTrack: 'dojo',
        selectedBelts: [],
        selectedGroup: 'all',
        selectedStatus: 'all',
        cumulative: false,
        search: '',
        mastered: loadMastered(),
        glossarySearch: '',
        glossaryKind: 'all',
        lightbox: null,

        glossaryKindOptions: [
          { value: 'all', label: 'Tout' },
          { value: 'notion', label: 'Notions & Dojo' },
          { value: 'racine', label: 'Racines' },
          { value: 'technique', label: 'Techniques' },
        ],

        groupOptions: [
          { value: 'all', label: 'Tout', hint: '' },
          { value: 'Nage-waza', label: 'Debout', hint: 'Nage-waza' },
          { value: 'Katame-waza', label: 'Sol', hint: 'Katame-waza' },
        ],
        statusOptions: [
          { value: 'all', label: 'Tout' },
          { value: 'todo', label: 'À revoir' },
          { value: 'done', label: 'Acquises' },
        ],

        async init() {
          try {
            const res = await fetch('syllabus.json');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            this.meta = data.meta || {};
            this.tracks = data.tracks || {};
            this.techniques = data.techniques || {};
            if (!this.tracks[this.selectedTrack]) {
              this.selectedTrack = Object.keys(this.tracks)[0] || '';
            }
            this.applyHash();
            window.addEventListener('hashchange', () => this.applyHash());
          } catch (e) {
            this.error = "Impossible de charger syllabus.json. Servez ce dossier via un serveur HTTP local (ex. python3 -m http.server 8000).";
          } finally {
            this.loading = false;
          }
        },

        applyHash() {
          const hash = decodeURIComponent(window.location.hash.replace('#', '').trim());
          if (!hash) return;
          if (this.tracks[hash]) {
            this.selectedTrack = hash;
            this.selectedBelts = [];
            return;
          }
          const parts = hash.split(',').map((s) => s.trim()).filter(Boolean);
          for (const [trackKey, track] of Object.entries(this.tracks)) {
            const trackBeltIds = new Set((track.belts || []).map((b) => b.id));
            const matched = parts.filter((id) => trackBeltIds.has(id));
            if (matched.length > 0) {
              this.selectedTrack = trackKey;
              this.selectedBelts = [...new Set(matched)];
              return;
            }
          }
        },

        setTrack(trackKey) {
          this.selectedTrack = trackKey;
          this.selectedBelts = [];
          history.replaceState(null, '', `#${trackKey}`);
        },

        get isAllBelts() {
          return this.selectedBelts.length === 0;
        },

        isBeltSelected(beltId) {
          return this.selectedBelts.includes(beltId);
        },

        toggleBelt(beltId) {
          if (beltId === 'all') {
            this.selectedBelts = [];
          } else if (this.selectedBelts.includes(beltId)) {
            this.selectedBelts = this.selectedBelts.filter((id) => id !== beltId);
          } else {
            this.selectedBelts = [...this.selectedBelts, beltId];
          }
          this.updateHash();
        },

        updateHash() {
          if (this.isAllBelts) {
            history.replaceState(null, '', `#${this.selectedTrack}`);
            return;
          }
          const ordered = this.currentBelts
            .filter((b) => this.selectedBelts.includes(b.id))
            .map((b) => b.id);
          history.replaceState(null, '', ordered.length ? `#${ordered.join(',')}` : `#${this.selectedTrack}`);
        },

        get currentTrack() {
          return this.tracks[this.selectedTrack] || null;
        },

        get currentBelts() {
          return this.currentTrack?.belts || [];
        },

        getTech(id) {
          return this.techniques[id] || { name: id, french_name: '', mechanics: [], videos: {} };
        },

        isMastered(id) {
          return Boolean(this.mastered[id]);
        },

        toggleMastered(id) {
          const next = { ...this.mastered };
          if (next[id]) delete next[id];
          else next[id] = true;
          this.mastered = next;
          this.saveMastered();
        },

        resetProgress() {
          if (!confirm('Effacer toute la progression enregistrée sur cet appareil ?')) return;
          this.mastered = {};
          this.saveMastered();
        },

        saveMastered() {
          try {
            localStorage.setItem(MASTERED_KEY, JSON.stringify(this.mastered));
          } catch {
            // Storage unavailable (private mode): progress lives for this session only.
          }
        },

        progressOf(items) {
          const ids = [...new Set(items.map((i) => i.id))];
          return { done: ids.filter((id) => this.isMastered(id)).length, total: ids.length };
        },

        pct(p) {
          return p.total ? Math.round((100 * p.done) / p.total) : 0;
        },

        isComplete(belt) {
          const p = this.progressOf(belt.items);
          return p.total > 0 && p.done === p.total;
        },

        get filtersActive() {
          return Boolean(this.search) || this.selectedGroup !== 'all' || this.selectedStatus !== 'all';
        },

        resetFilters() {
          this.search = '';
          this.selectedGroup = 'all';
          this.selectedStatus = 'all';
        },

        get trackProgress() {
          return this.progressOf(this.currentBelts.flatMap((b) => b.items));
        },

        get visibleBelts() {
          if (this.isAllBelts) return this.currentBelts;
          if (this.cumulative) {
            const maxIdx = this.currentBelts.reduce(
              (max, b, idx) => (this.selectedBelts.includes(b.id) ? idx : max),
              -1
            );
            return maxIdx === -1 ? [] : this.currentBelts.slice(0, maxIdx + 1);
          }
          return this.currentBelts.filter((b) => this.selectedBelts.includes(b.id));
        },

        matchesSearch(item, tokens) {
          if (tokens.length === 0) return true;
          const tech = this.getTech(item.id);
          const haystack = normalize(
            [tech.name, tech.french_name, tech.category, item.note, ...(tech.mechanics || [])].join(' ')
          );
          return tokens.every((t) => haystack.includes(t));
        },

        get filteredBelts() {
          const tokens = this.search.split(/\s+/).map(normalize).filter(Boolean);
          return this.visibleBelts
            .map((belt) => {
              const items = belt.items.filter((item) => {
                if (this.selectedGroup !== 'all' && item.group !== this.selectedGroup) return false;
                if (this.selectedStatus === 'done' && !this.isMastered(item.id)) return false;
                if (this.selectedStatus === 'todo' && this.isMastered(item.id)) return false;
                return this.matchesSearch(item, tokens);
              });
              return { ...belt, items, progress: this.progressOf(belt.items) };
            })
            .filter((belt) => belt.items.length > 0);
        },

        openGlossary() {
          this.$refs.glossaryDialog?.showModal();
        },

        openLightbox(tech, index = 0) {
          const images = tech.images || [];
          if (!images.length) return;
          this.lightbox = { name: tech.name, images, index };
          this.$refs.lightboxDialog?.showModal();
        },

        stepLightbox(delta) {
          if (!this.lightbox) return;
          const total = this.lightbox.images.length;
          this.lightbox = {
            ...this.lightbox,
            index: ((this.lightbox.index + delta) % total + total) % total,
          };
        },

        get glossaryEntries() {
          const techEntries = Object.values(this.techniques).map((t) => ({
            jp: t.name,
            fr: t.french_name || '',
            kind: 'technique',
            badge: t.category || 'Technique',
          }));
          return [...JUDO_GLOSSARY, ...techEntries].sort((a, b) =>
            a.jp.localeCompare(b.jp, 'fr', { sensitivity: 'base' })
          );
        },

        get filteredGlossary() {
          const tokens = this.glossarySearch.split(/\s+/).map(normalize).filter(Boolean);
          return this.glossaryEntries.filter((entry) => {
            if (this.glossaryKind !== 'all' && entry.kind !== this.glossaryKind) return false;
            if (tokens.length === 0) return true;
            const haystack = normalize(`${entry.jp} ${entry.fr} ${entry.badge}`);
            return tokens.every((t) => haystack.includes(t));
          });
        },
      };
    }

    if (!('closedBy' in HTMLDialogElement.prototype)) {
      const outside = (e, dialog) => {
        const r = dialog.getBoundingClientRect();
        return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
      };
      for (const dialog of document.querySelectorAll('dialog[closedby="any"]')) {
        let pressedOutside = false;
        dialog.addEventListener('pointerdown', (e) => { pressedOutside = outside(e, dialog); });
        dialog.addEventListener('pointerup', (e) => { if (pressedOutside && outside(e, dialog)) dialog.close(); });
      }
    }

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
